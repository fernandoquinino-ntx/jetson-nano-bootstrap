# GitLab CI/CD – builds standalone binaries of jetson_flasher.py with PyInstaller.
#
#   * every push / MR  -> lint + build macOS and Windows binaries (kept 30 days as artifacts)
#   * tag vX.Y.Z       -> additionally publishes the binaries to the Package Registry
#                         and creates a GitLab Release with download links
#
# Runners: GitLab.com SaaS runners (macOS and Windows tags below). On a self-managed
# GitLab, replace the `tags:` with your own macOS / Windows runner tags.

stages: [lint, build, release]

variables:
  APP_NAME: jetson-flasher
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - python -m py_compile jetson_flasher.py
    - python jetson_flasher.py --version
    # the tag must match __version__ in the script
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        V=$(python jetson_flasher.py --version | awk '{print $2}')
        [ "v$V" = "$CI_COMMIT_TAG" ] || { echo "Tag $CI_COMMIT_TAG != script version v$V"; exit 1; }
      fi

build:macos:
  stage: build
  image: macos-14-xcode-15
  tags: [saas-macos-medium-m1]          # Apple Silicon (arm64) runner
  script:
    - python3 -m venv .venv && source .venv/bin/activate
    - pip install --upgrade pip pyinstaller
    - pyinstaller --onefile --name ${APP_NAME}-macos-arm64 jetson_flasher.py
    - ./dist/${APP_NAME}-macos-arm64 --version
    - cd dist && shasum -a 256 ${APP_NAME}-macos-arm64 > ${APP_NAME}-macos-arm64.sha256
  artifacts:
    name: "${APP_NAME}-macos-${CI_COMMIT_REF_SLUG}"
    paths: [dist/]
    expire_in: 30 days

build:windows:
  stage: build
  tags: [saas-windows-medium-amd64]
  script:
    - choco install python312 -y --no-progress
    - $env:Path = "C:\Python312;C:\Python312\Scripts;" + $env:Path
    - python -m pip install --upgrade pip pyinstaller
    - python -m PyInstaller --onefile --name ${APP_NAME}-windows-x64 jetson_flasher.py
    - .\dist\${APP_NAME}-windows-x64.exe --version
    - (Get-FileHash dist\${APP_NAME}-windows-x64.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii dist\${APP_NAME}-windows-x64.sha256
  artifacts:
    name: "${APP_NAME}-windows-${CI_COMMIT_REF_SLUG}"
    paths: [dist/]
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: ["build:macos", "build:windows"]
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for f in dist/${APP_NAME}-macos-arm64 dist/${APP_NAME}-windows-x64.exe; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PACKAGE_REGISTRY_URL}/$(basename $f)"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Jetson Flasher $CI_COMMIT_TAG"
    description: "See CHANGELOG.md. Binaries are unsigned: see README (Gatekeeper / SmartScreen)."
    assets:
      links:
        - name: "macOS (Apple Silicon)"
          url: "${PACKAGE_REGISTRY_URL}/${APP_NAME}-macos-arm64"
          link_type: package
        - name: "Windows (x64)"
          url: "${PACKAGE_REGISTRY_URL}/${APP_NAME}-windows-x64.exe"
          link_type: package
